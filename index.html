<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>脳のメモリ解放</title>
    <!-- iPhone用のPWA設定 -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <link rel="apple-touch-icon" href="https://via.placeholder.com/192">
    <link rel="manifest" href="manifest.json">
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background-color: #f5f7fa; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .app-container { background: white; padding: 30px; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); text-align: center; width: 85%; max-width: 400px; }
        h1 { color: #1d1d1f; font-size: 24px; margin-bottom: 10px; font-weight: 600; }
        p { color: #86868b; font-size: 14px; margin-bottom: 25px; line-height: 1.5; }
        input { width: 100%; padding: 15px; border: 1px solid #d2d2d7; border-radius: 12px; font-size: 16px; box-sizing: border-box; margin-bottom: 15px; outline: none; transition: border-color 0.2s; }
        input:focus { border-color: #0071e3; }
        button { width: 100%; background: #0071e3; color: white; border: none; padding: 15px; border-radius: 12px; font-size: 16px; font-weight: bold; cursor: pointer; }
        button:active { background: #005bb5; }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>🧠 脳のメモリ解放</h1>
        <p>業務中の「わからない」を瞬時にストックし、<br>スマートなナレッジ蓄積をサポートします</p>
        <input type="text" id="wordInput" placeholder="専門用語・キーワードを入力...">
        <button onclick="saveWord()">ナレッジを蓄積する</button>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('sw.js')
                .then(() => console.log('PWA準備OK!'))
                .catch(err => console.log('Error:', err));
        }

        function saveWord() {
            const word = document.getElementById('wordInput').value;
            if(word) {
                alert(`「${word}」を一時保存しました。あとでAIが自動解説します。`);
                document.getElementById('wordInput').value = '';
            } else {
                alert('単語を入力してください。');
            }
        }
    </script>
</body>
</html>
